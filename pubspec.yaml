name: dart_hnsw
version: 0.1.0
description: Cross-platform Dart Native bindings for hnswlib with explicit persistence and shared in-process indexing.
homepage: https://github.com/ktwosoft/dart_hnsw
repository: https://github.com/ktwosoft/dart_hnsw
issue_tracker: https://github.com/ktwosoft/dart_hnsw/issues
topics:
  - ffi
  - hnsw
  - vector-search
  - ann

platforms:
  linux:
  macos:
  windows:

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  ffi: ^2.1.0
  code_assets: ^1.2.1
  hooks: ^2.0.2
  native_toolchain_c: ^0.19.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
